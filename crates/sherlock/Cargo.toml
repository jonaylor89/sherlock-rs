[package]
name = "sherlock"
description = "🔍 Hunt down social media accounts by username across social networks"
authors = ["Johannes Naylor <me@jonaylor.com>"]
license = "MIT"
version = "5.0.7"
edition = "2024"
readme = "../../README.md"
repository = "https://github.com/jonaylor89/sherlock-rs"
keywords = ["osint", "reconnaissance", "information", "gathering"]
homepage = "https://www.jonaylor.com/blog/make-an-exe-file"


[dependencies]
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
color-eyre = "0.6.5"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio-macros = "2.6.0"
futures = "0.3.32"
regex = "1.12.3"
tokio-stream = "0.1.18"
thiserror = "1.0.69"
serde_json = "1.0.149"
serde_path_to_error = "0.1.20"
fancy-regex = "0.13.0"
clap = { version = "4.5.59", features = ["derive"] }
colored = "2.2.0"
rust_xlsxwriter = { version = "0.73.0", optional = true }
open = "5.3.3"
rand = "0.8.5"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }

[features]
xlsx = ["dep:rust_xlsxwriter"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
