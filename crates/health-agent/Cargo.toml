[package]
name = "sherlock-health-agent"
description = "Automated site health monitor for sherlock — detects broken sites, stale data, and new WAF patterns"
authors = ["Johannes Naylor <jonaylor89@gmail.com>"]
license = "MIT"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/jonaylor89/sherlock-rs"
publish = false

[dependencies]
sherlock = { path = "../sherlock" }
tokio = { version = "1.39.2", features = ["macros", "rt-multi-thread"] }
color-eyre = "0.6.3"
reqwest = { version = "0.12.5", features = ["json"] }
serde = { version = "1.0.208", features = ["derive"] }
serde_json = "1.0.125"
clap = { version = "4.5.16", features = ["derive"] }
serde_path_to_error = "0.1.16"
chrono = { version = "0.4", features = ["serde"] }
fancy-regex = "0.13.0"
rand = "0.8.5"
