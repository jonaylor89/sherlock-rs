[package]
name = "sherlock-health-agent"
description = "Automated site health monitor for sherlock — detects broken sites, stale data, and new WAF patterns"
authors = ["Johannes Naylor <me@jonaylor.com>"]
license = "MIT"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/jonaylor89/sherlock-rs"
publish = false

[dependencies]
sherlock = { path = "../sherlock" }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
color-eyre = "0.6.5"
reqwest = { version = "0.12.28", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
clap = { version = "4.5.59", features = ["derive"] }
serde_path_to_error = "0.1.20"
chrono = { version = "0.4", features = ["serde"] }
fancy-regex = "0.13.0"
rand = "0.8.5"
